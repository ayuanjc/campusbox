# 校园 WiFi STA（wlan0）。SSID/PSK 由 uci 渲染后覆盖本文件。
ctrl_interface=/var/run/wpa_supplicant
update_config=1
ap_scan=1

network={
    ssid="ZCST-CMCC"
    psk="SET_BY_uci"
    key_mgmt=WPA-PSK
    priority=10
}

# 校园网常见开放 SSID（Portal 认证走 portal/campus-auth.sh）
network={
    ssid="ZCST"
    key_mgmt=NONE
    priority=5
}
