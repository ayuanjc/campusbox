# CampusBox AP（wlan1，192.168.8.0/24）
# 注意：8822CS 必须由驱动同时建出 wlan0(STA) 与 wlan1(AP)，这需要 SDK 侧 patch，
#      见 docs/SW-HANDOVER.md「4 件需硬件确认的事」第 3 条。
interface=wlan1
driver=nl80211
ssid=CampusBox
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=changeme-please
rsn_pairwise=CCMP
# 省电省热：默认 10 分钟无客户端自动关（由 ap-autoclose.sh 判定）
max_num_sta=8
